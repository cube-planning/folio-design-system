<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table 3.0 — Folio DS Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<style>
/* Table tokens (inlined so the prototype is self-contained) */
:root{
  --color-white:#FFFFFF; --color-gray-200:#F2F5F9; --color-gray-300:#E3E8EF;
  --color-gray-500:#97A3B6; --color-gray-700:#4A5567; --color-gray-900:#222B3A;
  --color-border-strong:#E3E8EF; --border-table-stroke:#F2F5F9;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Nunito Sans', BlinkMacSystemFont, sans-serif; background: #F0F2F5; display: flex; justify-content: center; padding: 2rem; min-height: 100vh; }
.wrap { width: 1040px; }
.header { padding: 1.5rem 0 1rem; }
.header h1 { font-size: 22px; font-weight: 700; color: #0E2349; margin-bottom: 4px; }
.header p { font-size: 13px; color: #677489; }
.sb { background: white; border: 1px solid #E0E5EC; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 12px rgba(16,24,40,.06); }
.sb-bar { background: white; border-bottom: 1px solid #E5E5E5; display: flex; align-items: center; gap: 4px; padding: 0 14px; height: 42px; }
.sb-icon { width: 30px; height: 30px; border: none; background: none; cursor: pointer; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 14px; }
.sb-icon:hover { background: #F3F3F3; }
.sb-sep { width: 1px; height: 18px; background: #E5E5E5; margin: 0 4px; }
.sb-logo { display: flex; align-items: center; gap: 8px; }
.sb-logo-mark { display: flex; align-items: center; justify-content: center; }
.sb-logo-mark svg { display: block; height: 22px; width: auto; }
.sb-logo-text { font-size: 13px; font-weight: 700; color: #163D83; }
.sb-bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.sb-badge { font-size: 11px; font-weight: 600; color: #677489; background: #F1F4F8; padding: 2px 8px; border-radius: 99px; }
.sb-canvas { background: white; min-height: 160px; padding: 24px; border-bottom: 1px solid #E5E5E5; background-image: radial-gradient(#DEE3EC 1px, transparent 1px); background-size: 20px 20px; }
.sb-canvas.no-dots { background-image: none; }
.sb-codebar { background: white; display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid #E5E5E5; }
.sb-cbtn { font-size: 12px; color: #888; border: none; background: none; cursor: pointer; display: flex; align-items: center; gap: 5px; padding: 4px 0; }
.sb-cbtn:hover { color: #333; }
.code-snippet { display: none; background: #F6F8FA; border: 1px solid #E5E5E5; border-radius: 6px; padding: 10px 14px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: #333; margin: 0 16px 12px; line-height: 1.6; white-space: pre-wrap; }
.code-snippet.visible { display: block; }
#copied-msg { font-size: 12px; color: #229E66; margin-left: auto; opacity: 0; transition: opacity 200ms; }
#copied-msg.show { opacity: 1; }
.sb-tabs { background: white; display: flex; padding: 0 16px; border-bottom: 1px solid #E5E5E5; }
.sb-tab { padding: 10px 14px; font-size: 12px; font-weight: 600; color: #999; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.sb-tab.on { color: #163D83; border-bottom-color: #163D83; }
.ctl-row { display: grid; grid-template-columns: 120px 1fr; padding: 12px 16px; background: white; border-bottom: 1px solid #F2F2F2; align-items: center; }
.ctl-name { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; color: #333; }
.seg { display: inline-flex; border: 1px solid #E0E0E0; border-radius: 6px; overflow: hidden; width: max-content; }
.seg button { padding: 5px 12px; font-size: 12px; border: none; background: white; cursor: pointer; color: #777; border-right: 1px solid #E0E0E0; font-family: inherit; }
.seg button:last-child { border-right: none; }
.seg button.on { background: #163D83; color: white; font-weight: 700; }
.gallery-wrap { padding: 20px; background: #FAFAFA; }
.gallery-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #aaa; margin-bottom: 16px; }
.gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.gcell { background: white; border: 1px solid #E3E8EF; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.gcell-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.gcell-name { font-size: 13px; font-weight: 700; color: #222B3A; }
.gcell-api { font-family: 'DM Sans', sans-serif; font-size: 11px; color: #163D83; }
.gcell-demo { display: flex; align-items: center; min-height: 28px; }
.gcell-use { font-size: 11px; color: #97A3B6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Table 3.0 — Folio DS Prototype</h1>
    <p>Real Folio DS Table + cell variants. Pick a preset to generate a table · Cell gallery = say the name, get the cell.</p>
  </div>
  <div class="sb">
    <div class="sb-bar">
      <div class="sb-logo">
        <span class="sb-logo-mark">
          <svg width="20" height="22" viewBox="0 0 29 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M11.2464 5.30427L13.5369 4L13.5282 15.7556L11.229 17.0598L11.2464 5.30427Z" fill="#163D83"></path>
            <path d="M24.6057 21.23L14.8688 15.747V4L24.6057 9.5603V21.23Z" fill="#163D83"></path>
            <path d="M23.935 22.3624L14.2678 27.9999L4.68762 22.3109L14.1894 16.8622L23.935 22.3624Z" fill="#163D83"></path>
            <path d="M7.6318 9.67221L9.93103 8.35936L9.9136 17.8153L7.61438 19.1195L7.6318 9.67221Z" fill="#163D83"></path>
            <path d="M4.01742 14.4599L6.31665 13.1471L6.29923 19.8744L4 21.1786L4.01742 14.4599Z" fill="#163D83"></path>
          </svg>
        </span>
        <span class="sb-logo-text">Folio</span>
      </div>
      <div class="sb-sep"></div>
      <button class="sb-icon" id="btn-dots" title="Toggle dots"><i class="fa-solid fa-table-cells"></i></button>
      <div class="sb-bar-right"><span class="sb-badge">Table · Figma naming · 3.0</span></div>
    </div>

    <div class="sb-canvas" id="canvas"><div id="preview"></div></div>

    <div class="sb-codebar">
      <button class="sb-cbtn" id="btn-showcode"><i class="fa-solid fa-code" style="font-size:13px"></i> Show code</button>
      <button class="sb-cbtn" id="btn-copycode"><i class="fa-regular fa-copy" style="font-size:13px"></i> Copy code</button>
      <span id="copied-msg">Copied!</span>
    </div>
    <div class="code-snippet" id="code-block"></div>

    <div class="sb-tabs"><div class="sb-tab on">Presets</div><div class="sb-tab">Cell variants</div></div>
    <div class="ctl-row">
      <span class="ctl-name">preset</span>
      <div class="seg" id="preset-seg"></div>
    </div>

    <div class="gallery-wrap">
      <div class="gallery-label">Cell variants — say the name, get the cell</div>
      <div class="gallery-grid" id="gallery"></div>
    </div>
  </div>
</div>
<script src="table-3-prototype.bundle.js"></script>
</body>
</html>
