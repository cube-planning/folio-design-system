<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folio — Top Nav Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      color: #222B3A;
      background: #F2F5F9;
    }

    /* ── TOP NAV ─────────────────────────────────── */

    .topnav {
      height: 80px;
      background: #F2F5F9;
      border-bottom: 1px solid #E3E8EF;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Company Switcher — pill */
    .tn-company {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 32px;
      padding: 0 12px;
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      white-space: nowrap;
    }
    .tn-company-ic {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #173D82;
      flex-shrink: 0;
    }
    .tn-company-name {
      font-size: 12px;
      color: #677489;
    }
    .tn-chevron {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Right-side cluster */
    .tn-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Ghost icon buttons — 32×32 */
    .tn-btn {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    .tn-btn:hover { background: #F8FAFC; }

    /* AI sparkle button — 28×28 */
    .tn-ai-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tn-ai-btn:hover { opacity: 0.8; }

    /* User dropdown — pill */
    .tn-user {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 8px;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      white-space: nowrap;
    }

    /* User avatar */
    .tn-avatar {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      background: #E3E8EF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #4A5567;
      font-family: 'DM Sans', sans-serif;
      flex-shrink: 0;
    }

    .tn-user-name {
      font-size: 12px;
      color: #677489;
    }
  </style>
</head>
<body>

<!-- ════════════════ TOP NAV ════════════════ -->
<nav class="topnav">

  <!-- Left: Company Switcher -->
  <div class="tn-company">
    <div class="tn-company-ic">

    <span class="tn-company-name">Accuplanner Inc</span>
    <div class="tn-chevron">

        <path d="M1 1L5 5L9 1" stroke="#353F4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    </div>
  </div>

        </g>
      </svg>
    </button>

      </svg>
    </button>

    <!-- AI sparkle button — gradient border + gradient icon -->
    <button class="tn-ai-btn" title="AI Analyst">
      <img src="../assets/icons/AI Button.svg" width="28" height="28" alt="AI Analyst">
    </button>

    <!-- User dropdown -->
    <div class="tn-user">
      <div class="tn-avatar">NG</div>
      <span class="tn-user-name">Nina Graham</span>
      <div class="tn-chevron">
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none">
          <path d="M1 1L5 5L9 1" stroke="#353F4F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

  </div>
</nav>

</body>
</html>
