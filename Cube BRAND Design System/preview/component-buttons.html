<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, CTA gradient, secondary, ghost, AI, success" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 22px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row + .row { margin-top: 12px; }
  .btn { font-family: var(--font-body); font-size: 14px; font-weight: 600; border: none; cursor: pointer; padding: 10px 18px; border-radius: 8px; display: inline-flex; align-items: center; gap: 8px; transition: all 160ms cubic-bezier(.2,0,0,1); }
  .btn-primary { background: #12264D; color: #fff; }
  .btn-primary:hover { background: #0A1A39; }
  .btn-cta { background: linear-gradient(90deg, #5547A5, #0A1A39); color: #fff; }
  .btn-secondary { background: #fff; color: #12264D; box-shadow: inset 0 0 0 1px #CDD5DF; }
  .btn-secondary:hover { box-shadow: inset 0 0 0 1px #677489; }
  .btn-ghost { background: transparent; color: #12264D; }
  .btn-ghost:hover { background: #F2F5F9; }
  .btn-ai { background: #EDEAFF; color: #5547A5; box-shadow: inset 0 0 0 1px rgba(85,71,165,.2); }
  .btn-ai:hover { background: #E3DEFF; }
  .btn-success { background: #EBFFE8; color: #219E66; box-shadow: inset 0 0 0 1px rgba(33,158,102,.2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .8; }
</style>
</head><body>
  <div class="row">
    <button class="btn btn-primary">Request a demo</button>
    <button class="btn btn-cta">Get started</button>
    <button class="btn btn-secondary">View dashboard</button>
    <button class="btn btn-ghost">Learn more →</button>
  </div>
  <div class="row">
    <button class="btn btn-ai"><span class="dot"></span>Ask The Analyst</button>
    <button class="btn btn-success">Reconciled</button>
    <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px">Small</button>
    <button class="btn btn-primary" style="padding: 14px 22px; font-size: 16px">Large</button>
  </div>
</body></html>
