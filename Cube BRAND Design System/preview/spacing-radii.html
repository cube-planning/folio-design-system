<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs 2px · sm 4 · md 8 · lg 12 · xl 16 · pill" viewport="700x140" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .r { background: #fff; box-shadow: 0 2px 6px rgba(10,18,41,.06), inset 0 0 0 1px #E3E8EF; height: 76px; display:flex; flex-direction: column; align-items:center; justify-content:center; gap: 4px; }
  .n { font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--new-blue); }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--gray-500); }
</style>
</head><body>
  <div class="row">
    <div class="r" style="border-radius: 2px"><span class="n">xs</span><span class="v">2px</span></div>
    <div class="r" style="border-radius: 4px"><span class="n">sm</span><span class="v">4px</span></div>
    <div class="r" style="border-radius: 8px"><span class="n">md</span><span class="v">8px</span></div>
    <div class="r" style="border-radius: 12px"><span class="n">lg</span><span class="v">12px</span></div>
    <div class="r" style="border-radius: 16px"><span class="n">xl</span><span class="v">16px</span></div>
    <div class="r" style="border-radius: 999px"><span class="n">pill</span><span class="v">full</span></div>
  </div>
</body></html>
