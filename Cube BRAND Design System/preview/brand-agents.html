<!doctype html>
<!-- @dsCard group="Brand" name="FP&Agents suite" subtitle="Four named agents with signature edge-pair gradients" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>FP&Agents suite</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .a { background: #fff; border-radius: 12px; box-shadow: 0 2px 6px rgba(10,18,41,.06); padding: 14px; position: relative; overflow: hidden; }
  .a::before { content:""; position:absolute; inset: 0 0 auto 0; height: 3px; }
  .a.bp::before { background: linear-gradient(90deg, #12264D, #70CF98); }
  .a.pl::before { background: linear-gradient(90deg, #0A1A39, #70CF98); }
  .a.an::before { background: linear-gradient(90deg, #5547A5, #70CF98); }
  .a.dm::before { background: linear-gradient(90deg, #173D82, #5547A5); }
  .ico { width: 36px; height: 36px; border-radius: 8px; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-weight: 700; color:#fff; font-size: 14px; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--new-blue); margin-top: 10px; }
  .desc { font-family: var(--font-body); font-size: 12px; color: var(--gray-600); margin-top: 4px; line-height: 1.45; }
</style>
</head><body>
  <div class="grid">
    <div class="a bp"><div class="ico" style="background: linear-gradient(135deg, #12264D, #70CF98)">B</div><div class="name">The Business Partner</div><div class="desc">Board decks, investor narratives, cross-functional collaboration.</div></div>
    <div class="a pl"><div class="ico" style="background: linear-gradient(135deg, #0A1A39, #30886C)">P</div><div class="name">The Planner</div><div class="desc">Budgets, forecasts, rolling plans, variance tracking.</div></div>
    <div class="a an"><div class="ico" style="background: linear-gradient(135deg, #5547A5, #70CF98)">A</div><div class="name">The Analyst</div><div class="desc">Ad-hoc analysis, trend detection, anomaly flagging.</div></div>
    <div class="a dm"><div class="ico" style="background: linear-gradient(135deg, #173D82, #5547A5)">D</div><div class="name">The Data Manager</div><div class="desc">Governance, integrations, reconciliation, data quality.</div></div>
  </div>
</body></html>
