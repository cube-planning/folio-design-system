<!doctype html>
<!-- @dsCard group="Colors" name="Primary gradients" subtitle="Seven brand-signature full-width gradients + one wash" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Primary gradients</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 14px; }
  .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .g { border-radius: 10px; aspect-ratio: 1.6/1; padding: 10px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff; font-family: var(--font-body); }
  .g .n { font-weight: 700; font-size: 12px; }
  .g .d { font-family: var(--font-mono); font-size: 9.5px; opacity: .8; margin-top: 2px; }
</style>
</head><body>
  <div class="grid">
    <div class="g" style="background: linear-gradient(90deg, #12264D 0%, #30886C 55%, #70CF98 100%);"><span class="n">Intelligence Spectrum</span><span class="d">Primary brand gradient</span></div>
    <div class="g" style="background: linear-gradient(90deg, #5547A5 0%, #0A1A39 100%);"><span class="n">Brand CTA</span><span class="d">Conversion blocks</span></div>
    <div class="g" style="background: linear-gradient(180deg, #0A1229 0%, #0A1A39 50%, #12264D 100%);"><span class="n">Cool Depth</span><span class="d">Dark heroes</span></div>
    <div class="g" style="background: linear-gradient(90deg, #5547A5 0%, #173D82 100%);"><span class="n">AI Signal</span><span class="d">Agent / AI moments</span></div>
    <div class="g" style="background: linear-gradient(90deg, #30886C 0%, #70CF98 55%, #EBFFE8 100%); color:#0A1229"><span class="n">Growth</span><span class="d" style="opacity:.65">Customer outcomes</span></div>
    <div class="g" style="background: linear-gradient(180deg, #0A1229 0%, #5547A5 100%);"><span class="n">Midnight AI</span><span class="d">Premium deep-dives</span></div>
    <div class="g" style="background: linear-gradient(90deg, #0A1A39 0%, #30886C 55%, #70CF98 100%);"><span class="n">Full Journey</span><span class="d">Transformation stories</span></div>
    <div class="g" style="background: linear-gradient(180deg, #F4F7FD 0%, #EBFFE8 100%); color:#0A1229; box-shadow: inset 0 0 0 1px #E3E8EF"><span class="n">Soft Mint Wash</span><span class="d" style="opacity:.65">Light content sections</span></div>
  </div>
</body></html>
