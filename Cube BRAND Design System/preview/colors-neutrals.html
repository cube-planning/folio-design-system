<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="8-stop neutral ramp — Warm White to Gray 800" viewport="700x170" -->
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 16px; }
  .grid { grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .swatch { aspect-ratio: 1 / 1.2; padding: 6px; }
  .swatch .name { font-size: 10px; }
  .swatch .hex { font-size: 9px; }
</style>
</head><body>
  <div class="grid">
    <div class="swatch light" style="background:#FAFFF5; box-shadow: inset 0 0 0 1px #E3E8EF"><span class="name">Warm White</span><span class="hex">#FAFFF5</span></div>
    <div class="swatch light" style="background:#F4F7FD; box-shadow: inset 0 0 0 1px #E3E8EF"><span class="name">Cube White</span><span class="hex">#F4F7FD</span></div>
    <div class="swatch light" style="background:#F2F5F9; box-shadow: inset 0 0 0 1px #E3E8EF"><span class="name">Gray 200</span><span class="hex">#F2F5F9</span></div>
    <div class="swatch light" style="background:#E3E8EF"><span class="name">Gray 300</span><span class="hex">#E3E8EF</span></div>
    <div class="swatch light" style="background:#CDD5DF"><span class="name">Gray 400</span><span class="hex">#CDD5DF</span></div>
    <div class="swatch" style="background:#97A3B6"><span class="name">Gray 500</span><span class="hex">#97A3B6</span></div>
    <div class="swatch" style="background:#677489"><span class="name">Gray 600</span><span class="hex">#677489</span></div>
    <div class="swatch" style="background:#353F4F"><span class="name">Gray 800</span><span class="hex">#353F4F</span></div>
  </div>
</body></html>
