<!doctype html>
<!-- @dsCard group="Components" name="Dark hero" subtitle="Intelligence Spectrum hero with tagline and dual CTAs" viewport="700x300" -->
<html><head><meta charset="utf-8"><title>Dark hero</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 0; }
  .hero { background: linear-gradient(90deg, #12264D 0%, #30886C 55%, #70CF98 100%); padding: 28px 32px; color: #fff; min-height: 260px; display: flex; flex-direction: column; justify-content: center; gap: 12px; position: relative; overflow: hidden; }
  .eyebrow { font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: .85; color: #EBFFE8; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.05; letter-spacing: -0.02em; margin: 0; max-width: 620px; }
  p { font-family: var(--font-body); font-size: 16px; color: rgba(255,255,255,0.82); margin: 0; max-width: 560px; }
  .row { display: flex; gap: 10px; margin-top: 8px; }
  .btn { font-family: var(--font-body); font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 8px; }
  .p1 { background: #fff; color: #12264D; }
  .p2 { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
</style>
</head><body>
  <div class="hero">
    <span class="eyebrow">The Agentic Finance Layer</span>
    <h1>Decision-ready data, everywhere you work.</h1>
    <p>From Books to Boardroom in 30 minutes. Your spreadsheets stay. Everything underneath gets smarter.</p>
    <div class="row">
      <span class="btn p1">Request a demo</span>
      <span class="btn p2">See The Analyst →</span>
    </div>
  </div>
</body></html>
