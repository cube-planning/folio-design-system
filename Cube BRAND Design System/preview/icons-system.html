<!doctype html>
<!-- @dsCard group="Components" name="Icon system" subtitle="Lucide 1.5px outline — color-mapped UI icons" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_shared.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .cell { background: #fff; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--gray-300); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px 4px; }
  .cell svg { width: 22px; height: 22px; stroke-width: 1.5; }
  .lbl { font-family: var(--font-body); font-size: 10px; color: var(--gray-600); }
  .default { color: #677489; }
  .active { color: #12264D; }
  .ai { color: #5547A5; }
  .ok { color: #219E66; }
  .warn { color: #D4802A; }
  .err { color: #E53E3E; }
  .onwhite { background: #0A1229; color: #fff; }
  .onwhite .lbl { color: rgba(255,255,255,.6); }
</style>
</head><body>
  <div class="grid">
    <div class="cell default"><i data-lucide="home"></i><span class="lbl">default</span></div>
    <div class="cell active"><i data-lucide="layout-dashboard"></i><span class="lbl">active</span></div>
    <div class="cell ai"><i data-lucide="sparkles"></i><span class="lbl">AI</span></div>
    <div class="cell ok"><i data-lucide="check-circle-2"></i><span class="lbl">success</span></div>
    <div class="cell warn"><i data-lucide="triangle-alert"></i><span class="lbl">warning</span></div>
    <div class="cell err"><i data-lucide="circle-x"></i><span class="lbl">error</span></div>
    <div class="cell onwhite"><i data-lucide="database" style="color:#70CF98"></i><span class="lbl">on dark</span></div>
    <div class="cell default"><i data-lucide="line-chart"></i><span class="lbl">chart</span></div>
    <div class="cell default"><i data-lucide="file-text"></i><span class="lbl">report</span></div>
    <div class="cell default"><i data-lucide="git-branch"></i><span class="lbl">trace</span></div>
    <div class="cell default"><i data-lucide="users"></i><span class="lbl">team</span></div>
    <div class="cell default"><i data-lucide="settings"></i><span class="lbl">settings</span></div>
    <div class="cell default"><i data-lucide="search"></i><span class="lbl">search</span></div>
    <div class="cell default"><i data-lucide="bell"></i><span class="lbl">alerts</span></div>
    <div class="cell default"><i data-lucide="plug"></i><span class="lbl">connect</span></div>
    <div class="cell default"><i data-lucide="calculator"></i><span class="lbl">calc</span></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
