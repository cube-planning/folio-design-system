<!doctype html>
<!-- @dsCard group="Colors" name="Primary gradients" subtitle="Seven brand-signature full-width gradients + one wash" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Primary gradients</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 14px; }
  .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .g { border-radius: 10px; aspect-ratio: 1.6/1; padding: 10px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff; font-family: var(--font-body); }
  .g .n { font-weight: 700; font-size: 12px; }
  .g .d { font-family: var(--font-mono); font-size: 9.5px; opacity: .8; margin-top: 2px; }
</style>
</head><body>
  <div class="grid">
    <div class="g" style="background: linear-gradient(90deg, #122E64 0%, #067647 55%, #70CF98 100%);"><span class="n">Intelligence Spectrum</span><span class="d">Primary brand gradient</span></div>
    <div class="g" style="background: linear-gradient(90deg, var(--deep-purple) 0%, #0B1932 100%);"><span class="n">Brand CTA</span><span class="d">Conversion blocks</span></div>
    <div class="g" style="background: linear-gradient(180deg, #081121 0%, #0B1932 50%, #122E64 100%);"><span class="n">Cool Depth</span><span class="d">Dark heroes</span></div>
    <div class="g" style="background: linear-gradient(90deg, var(--deep-purple) 0%, #173D82 100%);"><span class="n">AI Signal</span><span class="d">Agent / AI moments</span></div>
    <div class="g" style="background: linear-gradient(90deg, #067647 0%, #70CF98 55%, #ECFDF3 100%); color:#081121"><span class="n">Growth</span><span class="d" style="opacity:.65">Customer outcomes</span></div>
    <div class="g" style="background: linear-gradient(180deg, #081121 0%, var(--deep-purple) 100%);"><span class="n">Midnight AI</span><span class="d">Premium deep-dives</span></div>
    <div class="g" style="background: linear-gradient(90deg, #0B1932 0%, #067647 55%, #70CF98 100%);"><span class="n">Full Journey</span><span class="d">Transformation stories</span></div>
    <div class="g" style="background: linear-gradient(180deg, #F5F7FA 0%, #ECFDF3 100%); color:#081121; box-shadow: inset 0 0 0 1px #E3E8EF"><span class="n">Soft Mint Wash</span><span class="d" style="opacity:.65">Light content sections</span></div>
  </div>
</body></html>
