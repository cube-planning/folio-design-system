<!doctype html>
<!-- @dsCard group="Colors" name="Accent & signal" subtitle="Amber pair, Deep Purple (AI only), Pink" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Accents</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 16px; }
  .grid { grid-template-columns: repeat(4, 1fr); }
  .swatch { aspect-ratio: 1.4 / 1; }
</style>
</head><body>
  <div class="grid">
    <div class="swatch light" style="background:#FFFAEB"><span class="name">Amber Mist</span><span class="hex">#FFFAEB</span></div>
    <div class="swatch" style="background:#DC6803"><span class="name">Burnt Amber</span><span class="hex">#DC6803</span></div>
    <div class="swatch" style="background:var(--deep-purple)"><span class="name">Deep Purple</span><span class="hex">var(--deep-purple)</span><span class="hex" style="opacity:.7;margin-top:2px">AI only</span></div>
    <div class="swatch light" style="background:#FFE6E5"><span class="name">Pink</span><span class="hex">#FFE6E5</span></div>
  </div>
</body></html>
