<!doctype html>
<!-- @dsCard group="Spacing" name="Shadow & elevation" subtitle="Five elevation steps plus the AI ring" viewport="700x160" -->
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 22px; background: var(--cube-white); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .e { background: #fff; border-radius: 10px; height: 76px; display: flex; flex-direction: column; align-items:center; justify-content:center; gap:4px; }
  .n { font-family: var(--font-body); font-weight: 700; font-size: 12px; color: var(--new-blue); }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--gray-500); }
</style>
</head><body>
  <div class="row">
    <div class="e" style="box-shadow: 0 1px 2px rgba(10,18,41,.04)"><span class="n">xs</span><span class="v">hairline</span></div>
    <div class="e" style="box-shadow: 0 2px 6px rgba(10,18,41,.06), 0 1px 2px rgba(10,18,41,.04)"><span class="n">sm</span><span class="v">card rest</span></div>
    <div class="e" style="box-shadow: 0 6px 16px rgba(10,18,41,.07), 0 2px 4px rgba(10,18,41,.04)"><span class="n">md</span><span class="v">hover</span></div>
    <div class="e" style="box-shadow: 0 14px 32px rgba(10,18,41,.09), 0 4px 8px rgba(10,18,41,.05)"><span class="n">lg</span><span class="v">popover</span></div>
    <div class="e" style="box-shadow: 0 0 0 1px rgba(85,71,165,.25), 0 8px 24px rgba(85,71,165,.15)"><span class="n">ring-ai</span><span class="v">AI surface</span></div>
  </div>
</body></html>
