<!doctype html>
<!-- @dsCard group="Components" name="Status badges" subtitle="Semantic pills across success, warning, AI, error, neutral" viewport="700x120" -->
<html><head><meta charset="utf-8"><title>Status badges</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 22px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .b-ok { background: #ECFDF3; color: #229E66; }
  .b-warn { background: #FFFAEB; color: #DC6803; }
  .b-ai { background: #EBE9FE; color: var(--deep-purple); }
  .b-err { background: #FFE6E5; color: #D92D20; }
  .b-info { background: #F2F5F9; color: #122E64; }
  .b-neutral { background: #F2F5F9; color: var(--gray-600); }
  .b-outline { background: #fff; color: #122E64; box-shadow: inset 0 0 0 1px #CDD5E0; }
</style>
</head><body>
  <div class="row">
    <span class="badge b-ok"><span class="dot"></span>Reconciled</span>
    <span class="badge b-warn"><span class="dot"></span>Variance 2.4%</span>
    <span class="badge b-ai"><span class="dot"></span>Agent running</span>
    <span class="badge b-err"><span class="dot"></span>Disconnected</span>
    <span class="badge b-info">Q2-2026</span>
    <span class="badge b-neutral">Draft</span>
    <span class="badge b-outline">GL-4200</span>
    <span class="badge b-ok">+8.2% YoY</span>
  </div>
</body></html>
