<!doctype html>
<!-- @dsCard group="Components" name="Form inputs" subtitle="Text fields, error state, switch, checkbox" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Form inputs</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .f { display: flex; flex-direction: column; gap: 6px; }
  .lab { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.04em; }
  .inp { font-family: var(--font-body); font-size: 14px; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--gray-400); background: #fff; color: var(--gray-800); outline: none; }
  .inp:focus { border-color: #173D82; box-shadow: 0 0 0 3px rgba(23,61,130,.15); }
  .inp-err { border-color: #D92D20; }
  .help { font-family: var(--font-body); font-size: 12px; color: var(--gray-500); }
  .help.err { color: #D92D20; }
  .switch { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-body); font-size: 13px; color: var(--gray-800); }
  .sw { width: 34px; height: 20px; background: #067647; border-radius: 999px; position: relative; }
  .sw::after { content:""; width: 16px; height: 16px; border-radius: 50%; background: #fff; position: absolute; top: 2px; right: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .chk { width: 16px; height: 16px; border-radius: 3px; background: #122E64; display:inline-flex; align-items:center; justify-content:center; color:#fff; font-size:10px; }
</style>
</head><body>
  <div class="grid">
    <div class="f"><span class="lab">Organization</span><input class="inp" value="Crystalline Health, Inc."></div>
    <div class="f"><span class="lab">GL account</span><input class="inp" style="font-family: var(--font-mono)" value="GL-4200"></div>
    <div class="f"><span class="lab">Fiscal period</span><input class="inp inp-err" value="Q2-2026"><span class="help err">Period is locked. Reopen to edit.</span></div>
    <div class="f" style="justify-content: flex-end; gap: 14px">
      <label class="switch"><span class="sw"></span>Enable Trace to Truth</label>
      <label class="switch"><span class="chk">✓</span>Require GL mapping for all agents</label>
    </div>
  </div>
</body></html>
