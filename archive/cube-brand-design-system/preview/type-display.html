<!doctype html>

<html><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 20px; }

  .spec { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--gray-300); padding-bottom: 8px; }

  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--gray-500); white-space: nowrap; min-width: 200px; }
  .sample { font-family: var(--font-display); color: var(--new-blue); letter-spacing: -0.02em; line-height: 1.1; }
</style>
</head><body>
  <div class="stack">
    <div class="spec"><span class="meta">Display · DM Sans 800 · 44px</span><span class="sample" style="font-weight:800; font-size:44px">Decision-ready data</span></div>
    <div class="spec"><span class="meta">H1 · DM Sans 700 · 30px</span><span class="sample" style="font-weight:700; font-size:30px">From Books to Boardroom</span></div>
    <div class="spec"><span class="meta">H2 · DM Sans 500 · 23px</span><span class="sample" style="font-weight:500; font-size:23px; letter-spacing:-0.01em">The Agentic Finance Layer</span></div>
    <div class="spec"><span class="meta">H3 · DM Sans 500 · 19px</span><span class="sample" style="font-weight:500; font-size:19px; letter-spacing:-0.01em">Trace to Truth architecture</span></div>
  </div>
