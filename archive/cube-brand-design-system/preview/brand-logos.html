<!doctype html>
<!-- @dsCard group="Brand" name="Logos" subtitle="Four approved lockups across dark, photo, and light surfaces" viewport="700x260" -->
<html><head><meta charset="utf-8"><title>Logo lockups</title>
<link rel="stylesheet" href="_shared.css">
<style>
  body { padding: 16px; }
  .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { border-radius: 10px; padding: 16px; display: flex; align-items: center; justify-content: center; min-height: 100px; position: relative; }
  .tile img { max-width: 100%; max-height: 64px; object-fit: contain; }
  .tile .tag { position: absolute; top: 8px; left: 10px; font-family: var(--font-body); font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
  .bg-dark { background: var(--darkest); }
  .bg-navy { background: var(--navy); }
  .bg-white { background: #fff; box-shadow: inset 0 0 0 1px var(--gray-300); }
  .bg-cube { background: var(--cube-white); box-shadow: inset 0 0 0 1px var(--gray-300); }
  .bg-none { background: transparent; }
  .bg-dark .tag, .bg-navy .tag { color: rgba(255,255,255,0.7); }
  .bg-white .tag, .bg-cube .tag, .bg-none .tag { color: var(--gray-500); }
</style>
</head><body>
  <div class="wrap">
    <div class="tile bg-dark"><span class="tag">Gradient · Dark</span><img src="../assets/logo-gradient.png" alt=""></div>
    <div class="tile bg-navy"><span class="tag">Reversed · White</span><img src="../assets/logo-light.png" alt=""></div>
    <div class="tile bg-white"><span class="tag">Dark · Light BG</span><img src="../assets/logo-dark.png" alt=""></div>
    <div class="tile bg-none"><span class="tag">Gradient · Light</span><img src="../assets/logo-gradient-on-white.png" alt=""></div>
  </div>
</body></html>
