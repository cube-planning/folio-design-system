<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1440px&quot;,&quot;height&quot;:&quot;1357px&quot;},&quot;companyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Accuplanner Inc&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nina Graham&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;sourceName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;QuickBooks&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;connectionName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Shop Revenue Load&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;startCollapsed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
class Component extends DCLogic {
  state = { sbCollapsed: false, tab: 0, open: {}, query: '', onlyUnmapped: false };
  componentDidMount() {
    this._onClick = (e) => {
      const secEl = e.target.closest('.sec');
      if (secEl) { const ns = secEl.closest('.nav-section'); if (ns) ns.classList.toggle('collapsed'); return; }
      const tg = e.target.closest('[data-action="toggle"]');
      if (tg) { const id = tg.getAttribute('data-id'); this.setState((st) => ({ open: { ...st.open, [id]: !st.open[id] } })); return; }
      if (e.target.closest('[data-action="unmapped"]')) { this.setState((st) => ({ onlyUnmapped: !st.onlyUnmapped })); return; }
      const collapse = e.target.closest('[data-action="collapse"]');
      if (collapse) {
        const sb = document.getElementById('sb');
        if (sb) sb.classList.toggle('col');
        this.setState((st) => ({ sbCollapsed: !st.sbCollapsed }));
        return;
      }
    };
    document.addEventListener('click', this._onClick);
    if (this.props.startCollapsed) {
      const sb = document.getElementById('sb');
      if (sb) sb.classList.add('col');
      this.setState({ sbCollapsed: true });
    }
    if (!window.SIDEBAR_ICONS || !window.FolioDS) {
      this._iconWait = setInterval(() => {
        if (window.SIDEBAR_ICONS && window.FolioDS) { clearInterval(this._iconWait); this.forceUpdate(); }
      }, 60);
    }
  }
  componentWillUnmount() {
    document.removeEventListener('click', this._onClick);
    if (this._iconWait) clearInterval(this._iconWait);
  }
  // Mapping data per tab. A leaf with cube:null is unmapped. Dates are the last edit to the mapping.
  getData(src) {
    const L = (name, cube, flip, date) => ({ name, cube, flip, date });
    return [
      { label:'Account', icon:'fa-regular fa-clipboard', rule:{ text:'Map to Existing', color:'green' }, tree:[
        { id:'a-income', name:'Income', children:[
          L('Sales of Product Income', 'Product Revenue', false, 'Oct 14, 2026'),
          L('Services', 'Service Revenue', false, 'Oct 14, 2026'),
          L('Billable Expense Income', 'Reimbursed Expenses', false, 'Oct 9, 2026'),
          L('Discounts Given', 'Contra Revenue', true, 'Oct 9, 2026'),
          { id:'a-subs', name:'Subscription Revenue', children:[
            L('Annual Plans', 'Subscription Revenue', false, 'Oct 2, 2026'),
            L('Monthly Plans', 'Subscription Revenue', false, 'Oct 2, 2026')
          ] },
          L('Unapplied Cash Payment Income', null),
          L('Uncategorized Income', null)
        ] },
        { id:'a-cogs', name:'Cost of Goods Sold', open:false, children:[
          L('Hosting & Infrastructure', 'Cost of Revenue', false, 'Sep 28, 2026'),
          L('Customer Support Labor', 'Cost of Revenue', false, 'Sep 28, 2026'),
          L('Merchant Fees', null)
        ] },
        { id:'a-exp', name:'Expenses', open:false, children:[
          L('Payroll Expenses', 'Salaries & Wages', false, 'Oct 2, 2026'),
          L('Rent & Lease', 'Facilities', false, 'Sep 21, 2026'),
          L('Software Subscriptions', 'Software & Tools', false, 'Sep 21, 2026'),
          L('Travel & Meals', 'Travel & Entertainment', false, 'Sep 21, 2026'),

        ] }
      ] },
      { label:'Class', icon:'fa-regular fa-briefcase', rule:{ text:'Map to Existing', color:'green' }, tree:[
        { id:'c-dept', name:'Departments', children:[
          L('Sales', 'Sales', false, 'Oct 12, 2026'),
          L('Marketing', 'Marketing', false, 'Oct 12, 2026'),
          L('Engineering', 'Research & Development', false, 'Oct 5, 2026'),
          L('Customer Success', 'Customer Success', false, 'Oct 5, 2026'),

        { id:'u-ent', name:'Enterprise', children:[

        ] }
      ] }
    ];
  }
  // Filters one tab's tree by the search text and unmapped toggle; returns flat visible rows.
  flatten(tab) {
    const { open, query, onlyUnmapped } = this.state;
    const q = query.trim().toLowerCase();
    const filtering = !!q || onlyUnmapped;
    const keep = (n) => n.children ? n.children.some(keep)
      : (!q || n.name.toLowerCase().includes(q) || (n.cube || '').toLowerCase().includes(q)) && (!onlyUnmapped || !n.cube);
    const flat = [];
    const walk = (nodes, level) => nodes.forEach((n) => {
      if (!keep(n)) return;
      if (n.children) {
        flat.push({ ...n, level, kind:'group' });
        if (filtering || (open[n.id] ?? n.open ?? true)) walk(n.children, level + 1);
      } else flat.push({ ...n, level, kind:'leaf' });
    });
    walk(tab.tree, 0);
    return flat;
  }
  countUnmapped(tab) {
    const c = (nodes) => nodes.reduce((t, n) => t + (n.children ? c(n.children) : (n.cube ? 0 : 1)), 0);
    return c(tab.tree);
  }

  buildCrumbs(F, items) {
    const e = React.createElement;

    });

  }
  buildTable(tab, flat, source) {
    const e = React.createElement;
    const F = window.FolioDS;
    const open = this.state.open;
    const filtering = !!this.state.query.trim() || this.state.onlyUnmapped;
    const hd = [source + ' Dimension', 'Cube Dimension', 'Flip Sign', 'Last Modified'].map((h) =>
      e('div', { key:h }, h, e('i', { className:'fa-solid fa-sort' })));
    const rows = flat.map((r, i) => {
      const last = i === flat.length - 1;
      const pad = 8 + r.level * 24;
      const isOpen = filtering || (open[r.id] ?? r.open ?? true);
      const nameCell = r.kind === 'group'
        ? e('div', { className:'mp-name', style:{ paddingLeft:pad } },
            e('span', { className:'mp-caret mp-group', 'data-action':'toggle', 'data-id':r.id }, e('i', { className:isOpen ? 'fa-solid fa-caret-down' : 'fa-solid fa-caret-right' })),

            e('span', { className:'mp-leaf' }, e('i', { className:'fa-regular fa-file' })),
            e('span', { className:'mp-link' }, r.name));
      const leaf = r.kind === 'leaf';
      const mapped = leaf && r.cube;
      return e('div', { key:r.id || (r.name + i), className:'mp-row' + (last ? ' mp-last' : '') },
        nameCell,
        e('div', null, mapped ? r.cube : leaf ? e(F.Badge, { type:'solid', color:'yellow', size:'sm' }, 'Unmapped') : '--'),
        e('div', null, mapped ? e(F.Badge, { type:'solid', color:r.flip ? 'green' : 'red', size:'sm' }, r.flip ? 'Yes' : 'No') : '--'),
        e('div', null, mapped ? r.date : '--'));
    });

    const source = this.props.sourceName ?? 'QuickBooks';

    const unmappedCount = this.countUnmapped(tab);
    const unmappedLabel = 'Unmapped ' + tab.label + ' Dimensions';

        { label:'Status', value:'All' },

      ] });

    return { companyName, userName, ic, sideNavEl, crumbsEl, bellBtn, importBtn, tabsEl, editBtn, ruleBadge, filterEl, tableEl, unmappedCount, unmappedLabel };
