<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Cube Abstract Graphic" description="Abstract product graphic — four isometric glass planes suggesting layered financial models, with a decorative 3-series trend and one AI moment. Built from real Text and Badge components. Recipe: brand/glass-ui-style.md; series and marks: docs/foundation/CHART-RULES.md." -->
<helmet>
  <script src="./ds-base.js"></script>
  <link rel="stylesheet" href="../../ds-bundle/_ds_bundle.css">
  <script src="../../ds-bundle/_ds_bundle.js"></script>
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; min-height:100vh; overflow:hidden; }

    /* ---- Background: blurred blobs, never a hard-edged gradient, never
       flat. Cobalt / blue / teal / cyan only — no purple blob, since the
       AI callout is the only purple the frame is allowed. ------------- */
    /* Base is TRANSPARENT — the graphic composites onto whatever surface it
       is placed on (site section, slide, deck background). The blobs below
       still travel with it: they are what the glass transmits, and without
       them the panels have nothing to read through. Do not reintroduce a
       flat fill here. */
    .bg   { position:absolute; inset:0; background:transparent; overflow:hidden; }
    .blob { position:absolute; border-radius:50%; }
    /* 50–70% at 60–80px blur, per § 4. Positioned so the densest colour sits
       behind the panels rather than out in empty canvas. */
    .blob-1 { width:660px; height:660px; left:-120px; top:-180px;    background:#173D82; opacity:0.62; filter:blur(70px); }
    .blob-2 { width:520px; height:520px; right:-40px; top:-60px;     background:#06B6D4; opacity:0.58; filter:blur(65px); }
    .blob-3 { width:620px; height:620px; left:280px;  bottom:-220px; background:#14B8A6; opacity:0.60; filter:blur(70px); }
    .blob-4 { width:480px; height:480px; right:100px; bottom:-160px; background:#4B7CD8; opacity:0.66; filter:blur(60px); }

    /* ---- Stage: ONE shared perspective for every plane -------------- */
    /* Height is sized to the composition's real extent (the AI plane's
       bottom edge + its glow), not padded — dead space below the planes
       shows up as empty canvas in an export. */
    .stage { position:relative; width:1280px; height:640px; margin:0 auto; perspective:1800px; }

    /* ---- Plane: identical rotation on every layer; only --depth
       differs. Varying rotation per plane is what breaks the shared-plane
       illusion (brand/glass-ui-style.md § 2). ------------------------------- */
    .plane {
      position:absolute;
      border-radius:16px;
      transform: rotateX(8deg) rotateY(-14deg) rotateZ(1.5deg) translateZ(var(--depth,0px));
      transform-style:preserve-3d;
    }

    .glass-frosted {
      background: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.28));
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: 0 40px 80px -20px rgba(40,50,90,0.28),
                  inset 0 1px 0 rgba(255,255,255,0.8);
    }
    /* Fill taken to the BOTTOM of the allowed 0.16–0.24 → 0.04–0.12 range,
       which is the most transparent the spec permits without changing it. */
    .glass-mirror {
      background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
      backdrop-filter: blur(4px) saturate(210%) contrast(105%);
      -webkit-backdrop-filter: blur(4px) saturate(210%) contrast(105%);
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 40px 80px -20px rgba(40,50,90,0.30),
                  inset 0 2px 0 rgba(255,255,255,0.92);
    }
    /* Cobalt-tinted — frosted recipe with the white fill swapped for the
       brand primary. rgba(23,61,130,…) is --color-cobalt-500 #173D82. */
    .glass-cobalt {
      background: linear-gradient(135deg, rgba(23,61,130,0.32), rgba(23,61,130,0.14));
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: 0 40px 80px -20px rgba(40,50,90,0.28),
                  inset 0 1px 0 rgba(255,255,255,0.8);
    }

    /* Specular streak — required on clear-mirror panels. One direction
       (115deg) for the whole composition. */
    .streak {
      position:absolute; top:0; left:0; bottom:0; width:55%;
      border-radius:16px; pointer-events:none;
      background: linear-gradient(115deg,
        rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.05) 40%, transparent 60%);
    }

    /* Internal skew cue — a small, simple plane has no internal lines for
       the eye to measure the tilt against (brand/glass-ui-style.md § 2). */
    .skew-lines {
      position:absolute; inset:0; border-radius:16px; pointer-events:none; opacity:0.5;
      background: repeating-linear-gradient(115deg,
        transparent 0px, transparent 38px,
        rgba(255,255,255,0.35) 39px, transparent 40px);
    }

    /* Matted inner surface (brand/glass-ui-style.md § 1). The mirror frame around
       it does the transmitting; this carries the copy. 12px is the nested
       tile stop — the container above stays 16px. No shadow: only the outer
       panel casts one. */
    .mat {
      position:relative;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px) saturate(150%);
      -webkit-backdrop-filter: blur(12px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 20px;
    }

    /* AI glow — #7A5AF8 is the one flat hex sanctioned for the AI accent,
       and only because box-shadow can't render a gradient. Written
       literally until --glow-ai lands (docs/foundation/BRAND-FOUNDATION.md). */
    .glow-ai {
      box-shadow: 0 24px 64px -12px rgba(122,90,248,0.45),
                  0 0 40px rgba(122,90,248,0.25);
    }

    /* The deep plane's own internal structure — this is what gives the
       large panel its tilt cue for free. */
    .grid-lines {
      position:absolute; inset:0; border-radius:16px; pointer-events:none; opacity:0.45;
      background:
        repeating-linear-gradient(0deg,  transparent 0 47px, rgba(255,255,255,0.45) 47px 48px),
        repeating-linear-gradient(90deg, transparent 0 79px, rgba(255,255,255,0.45) 79px 80px);
    }

    .eyebrow { letter-spacing:0.08em; text-transform:uppercase; }

    .ai-icon {
      width:36px; height:36px; border-radius:9999px; flex:none;
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:15px;
      background: linear-gradient(135deg, #7A5AF8 10%, #9B8AFB 50%, #6938EF 100%);
    }

    /* Front-most plane only. Animates a wrapper, never the plane itself —
       a transform on the plane would overwrite its rotation. */
    .float { animation: glassFloat 7s ease-in-out infinite; }
    @keyframes glassFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }
    @media (prefers-reduced-motion: reduce) { .float { animation: none; } }
  </style>
</helmet>

<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<div class="stage">{{ stageEl }}</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;680px&quot;}}">
// Cube Abstract Graphic — see brand/glass-ui-style.md for the recipe this implements.
//
// Abstract, not a dashboard: the planes stand in for layered financial
// models rather than showing real UI. Layer plan (§2 of the style guide):
//   back   — planning model,     cobalt-tinted, translateZ 0
//   middle — consolidation,      frosted matte, translateZ 70px
//   front  — reporting surface,  clear mirror,  translateZ 160px
//   AI     — the one purple,     clear mirror + glow, translateZ 230px
//
// Every plane reuses ONE rotation triple — rotateX(8) rotateY(-14) rotateZ(1.5).
// If you add a fifth plane, copy that triple verbatim and give it a new --depth.

// Decorative chart — docs/foundation/CHART-RULES.md § "Glass-surface charts".
// Slots 1 / 4 / 6 (teal / indigo / orange) give the widest spread; slot 2
// (cyan) is skipped because it sits next to teal on the wheel and the
// panel's own saturate() pushes them closer still. Ascending order kept.
// 2px round-cap strokes, no area fill, and no per-point value labels —
// this is illustration, not a figure anyone reads a number off.
// Markers ARE required here: 7 points per series is under the 12-point
// threshold, so each point gets an 8px (r=4) dot — borderless over glass,
// where a white surface ring would break the hue and read as a separate
// bead. Only the *labels* are omitted; the marks themselves stay.
const MARKER_R = 4;
const SERIES = [
  { color: '#14B8A6', pts: [[0,96],[60,80],[120,84],[180,52],[240,44],[300,22],[360,14]] },    // dataviz-1 teal-500
  { color: '#6366F1', pts: [[0,128],[60,120],[120,104],[180,108],[240,78],[300,66],[360,48]] }, // dataviz-4 indigo-500
  { color: '#F97316', pts: [[0,56],[60,64],[120,58],[180,74],[240,86],[300,92],[360,108]] },    // dataviz-6 orange-500
];

class Component extends DCLogic {
  componentDidMount() {
    if (!window.FolioDS) {
      this._dsWait = setInterval(() => {
        if (window.FolioDS) { clearInterval(this._dsWait); this.forceUpdate(); }
      }, 60);
    }
  }

  componentWillUnmount() {
    if (this._dsWait) clearInterval(this._dsWait);
  }

  // Back plane — the deep model layer. Cobalt-tinted, so its text goes
  // white, never gray-900 (brand/glass-ui-style.md § 1).
  renderModelPlane(F) {
    return React.createElement('div', {
      key: 'model',
      className: 'plane glass-cobalt',
      style: { '--depth': '0px', left: 40, top: 60, width: 700, height: 430, padding: 28 },
    },
      React.createElement('div', { className: 'grid-lines' }),
      React.createElement('div', { style: { position: 'relative' } },
        React.createElement(F.Text, {
          variant: 'caption-1', weight: 'semibold', className: 'eyebrow',
          style: { color: 'rgba(255,255,255,0.78)' },
        }, 'Planning model'),
        React.createElement(F.Text, {
          variant: 'display-3', weight: 'bold',
          style: { color: '#FFFFFF', marginTop: 10, maxWidth: 420 },
        }, 'Every driver, every scenario, one model'),
      ),
    );
  }

  // Middle plane — frosted matte, the content-dense layer. It is the only
  // variant where dense marks stay legible over a busy background.
  renderTrendPlane(F) {
    return React.createElement('div', {
      key: 'trend',
      className: 'plane glass-frosted',
      style: { '--depth': '70px', left: 290, top: 250, width: 560, height: 290, padding: 28 },
    },
      React.createElement(F.Text, {
        variant: 'caption-1', weight: 'semibold', className: 'eyebrow',
        style: { color: '#4A5567' },
      }, 'Actuals vs. plan'),
      React.createElement('svg', {
        width: 480, height: 170, viewBox: '-10 0 380 140',
        style: { display: 'block', marginTop: 18, overflow: 'visible' },
      },
        [30, 70, 110].map(g => React.createElement('line', {
          key: 'g' + g, x1: 0, x2: 360, y1: g, y2: g,
          stroke: 'rgba(255,255,255,0.55)', strokeWidth: 1,
        })),
        SERIES.map((s, i) => React.createElement('polyline', {
          key: 'p' + i, fill: 'none', stroke: s.color, strokeWidth: 2,
          strokeLinecap: 'round', strokeLinejoin: 'round',
          points: s.pts.map(p => p.join(',')).join(' '),
        })),
        SERIES.map((s, i) => s.pts.map(([cx, cy], j) =>
          React.createElement('circle', {
            key: 'm' + i + '-' + j, cx, cy, r: MARKER_R, fill: s.color,
          }))),
      ),
    );
  }

  // Front plane — clear mirror. Required streak: without one it reads as a
  // plain low-opacity rectangle rather than glass.
  renderReportPlane(F) {
    return React.createElement('div', {
      key: 'report',
      className: 'plane glass-mirror',
      style: { '--depth': '160px', left: 640, top: 120, width: 380, height: 226, padding: 20 },
    },
      React.createElement('div', { className: 'streak' }),
      React.createElement('div', { className: 'skew-lines' }),
      React.createElement('div', { className: 'mat' },
        React.createElement(F.Text, {
          variant: 'title-2', weight: 'semibold', style: { color: '#1B2434' },
        }, 'Close, forecast, report'),
        React.createElement(F.Text, {
          variant: 'body', style: { color: '#4A5567', marginTop: 10 },
        }, 'One source of truth, from the ledger through to the board deck.'),
      ),
    );
  }

  // The AI moment — the ONLY purple in the frame. Pill is the real Badge.
  renderAiPlane(F) {
    return React.createElement('div', {
      key: 'ai',
      className: 'float',
      style: { position: 'absolute', left: 700, top: 430 },
    },
      React.createElement('div', {
        className: 'plane glass-mirror glow-ai',
        style: { '--depth': '230px', position: 'relative', width: 360, height: 162, padding: 18 },
      },
        React.createElement('div', { className: 'streak' }),
        React.createElement('div', { className: 'skew-lines' }),
        React.createElement('div', {
          className: 'mat',
          style: { display: 'flex', gap: 14, alignItems: 'flex-start' },
        },
          React.createElement('div', { className: 'ai-icon' },
            React.createElement('i', { className: 'fa-solid fa-sparkles' })),
          React.createElement('div', null,
            React.createElement(F.Badge, { color: 'ai', type: 'solid' }, 'Cube AI'),
            React.createElement(F.Text, {
              variant: 'body', weight: 'medium',
              style: { color: '#1B2434', marginTop: 10 },
            }, 'Variance explained before you think to ask.'),
          ),
        ),
      ),
    );
  }

  renderVals() {
    const F = window.FolioDS;
    if (!F) return {};

    const stageEl = React.createElement(React.Fragment, null,
      this.renderModelPlane(F),
      this.renderTrendPlane(F),
      this.renderReportPlane(F),
      this.renderAiPlane(F),
    );

    return { stageEl };
  }
}
</script>
</body>
</html>
