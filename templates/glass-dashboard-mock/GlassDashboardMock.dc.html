<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Glass Dashboard Mock" description="Marketing hero graphic — three isometric glass panels (frosted, clear-mirror, AI callout) built from real Text, PageHeader, Badge, StatusDot, Table, and IconBadge components. Recipe: glass-ui-style.md." -->
<helmet>
  <script src="./ds-base.js"></script>
  <link rel="stylesheet" href="../../ds-bundle/_ds_bundle.css">
  <script src="../../ds-bundle/_ds_bundle.js"></script>
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; min-height:100vh; overflow:hidden; }

    /* ---- Background: blurred blobs, never a hard-edged gradient.
       Cobalt / blue / teal / cyan only — no purple blob (purple is
       reserved for the one AI element in the frame). ------------- */
    .bg { position:absolute; inset:0; background:#F5F7FA; overflow:hidden; }
    .blob { position:absolute; border-radius:50%; }
    .blob-1 { width:640px; height:640px; left:-80px;  top:-140px; background:#4B7CD8; opacity:0.28; filter:blur(110px); }
    .blob-2 { width:560px; height:560px; right:-60px; top:-80px;  background:#06B6D4; opacity:0.22; filter:blur(100px); }
    .blob-3 { width:600px; height:600px; left:300px;  bottom:-180px; background:#14B8A6; opacity:0.26; filter:blur(110px); }
    .blob-4 { width:460px; height:460px; right:140px; bottom:-140px; background:#173D82; opacity:0.24; filter:blur(90px); }

    /* ---- Stage: ONE shared perspective for every panel ---------- */
    .stage { position:relative; width:1400px; height:780px; margin:0 auto; perspective:1800px; }

    /* ---- Panel: identical rotation on every layer; only --depth
       differs. Do not vary the rotation per panel. --------------- */
    .panel {
      position:absolute;
      border-radius:16px;
      transform: rotateX(8deg) rotateY(-14deg) rotateZ(1.5deg) translateZ(var(--depth, 0px));
      transform-style:preserve-3d;
    }

    /* Frosted matte — the content-dense panel */
    .glass-frosted {
      background: linear-gradient(135deg, rgba(255,255,255,0.55), rgba(255,255,255,0.28));
      backdrop-filter: blur(22px) saturate(170%);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      border: 1px solid rgba(255,255,255,0.65);
      box-shadow: 0 40px 80px -20px rgba(40,50,90,0.28),
                  inset 0 1px 0 rgba(255,255,255,0.8);
    }

    /* Clear mirror — low blur, high saturation, needs a streak */
    .glass-mirror {
      background: linear-gradient(135deg, rgba(255,255,255,0.20), rgba(255,255,255,0.08));
      backdrop-filter: blur(4px) saturate(210%) contrast(105%);
      -webkit-backdrop-filter: blur(4px) saturate(210%) contrast(105%);
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 40px 80px -20px rgba(40,50,90,0.30),
                  inset 0 2px 0 rgba(255,255,255,0.92);
    }

    /* Specular streak — top-left, ~55% width, one direction (115deg) */
    .streak {
      position:absolute; top:0; left:0; width:55%; height:100%;
      border-radius:16px 0 0 16px;
      pointer-events:none;
      background: linear-gradient(115deg,
        rgba(255,255,255,0.55) 0%,
        rgba(255,255,255,0.05) 40%,
        transparent 60%);
    }

    /* Internal skew cue — small panels have no grid lines of their own */
    .skew-lines {
      position:absolute; inset:0; border-radius:16px; pointer-events:none; opacity:0.5;
      background: repeating-linear-gradient(115deg,
        transparent 0px, transparent 38px,
        rgba(255,255,255,0.35) 39px, transparent 40px);
    }

    /* Nested card — half the fill, half the blur, NO drop shadow */
    .glass-nested {
      background: linear-gradient(135deg, rgba(255,255,255,0.34), rgba(255,255,255,0.16));
      backdrop-filter: blur(10px) saturate(150%);
      -webkit-backdrop-filter: blur(10px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.55);
      border-radius:16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
    }

    /* AI glow. Stands in for the --glow-ai token that BRAND-FOUNDATION.md
       calls for but that doesn't exist yet; keyed to #7A5AF8, the one flat
       hex sanctioned for the AI accent (box-shadow can't take a gradient). */
    .glow-ai {
      box-shadow: 0 24px 64px -12px rgba(122,90,248,0.45),
                  0 0 40px rgba(122,90,248,0.25),
                  inset 0 2px 0 rgba(255,255,255,0.9);
    }

    /* Float animates a WRAPPER — a transform on .panel would overwrite
       its rotation and collapse the shared plane. */
    .float { animation: glassFloat 6s ease-in-out infinite; }
    @keyframes glassFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-7px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .float { animation: none; }
    }

    .ai-gradient-text {
      background: linear-gradient(135deg, #7A5AF8 10%, #9B8AFB 50%, #6938EF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>
</helmet>

<div class="bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div class="blob blob-4"></div>
</div>

<div class="stage">{{ stageEl }}</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1400px&quot;,&quot;height&quot;:&quot;820px&quot;}}">
// Glass Dashboard Mock — see glass-ui-style.md for the recipe this implements.
//
// Layer plan (§2 of the style guide):
//   back   — Executive Overview dashboard, frosted matte, translateZ 0
//   middle — Revenue chart card,          clear mirror, translateZ 70px
//   front  — AI insight callout,          clear mirror + AI glow, translateZ 160px

// Dataviz series: slots 1 / 4 / 6 from --color-dataviz-*. Slot 2 (cyan) sits
// next to teal on the wheel, so the glass recipe skips it for three series.
// See docs/CHART-RULES.md § "Glass-surface charts".
//
// Actuals vs. forecast share a hue with the forecast dashed, per the form
// rule — the hue is never switched for forecast. Budget is the one separate
// categorical series, so it takes the next slot.
//
// The series are also spaced geometrically: at hero scale, over blur and a
// saturation shift, hue alone doesn't separate closely-tracking lines.
const SERIES = [
  { label: 'Actuals',  color: '#14B8A6', points: '0,88 84,72 168,74 252,44 336,34 420,14' },      // dataviz-1 teal-500
  { label: 'Forecast', color: '#14B8A6', dashed: true,
                                         points: '0,110 84,100 168,86 252,76 336,54 420,40' },   // dataviz-1, dashed
  { label: 'Budget',   color: '#F97316', points: '0,132 84,128 168,120 252,114 336,104 420,92' }, // dataviz-6 orange-500
];

const STATS = [
  { label: 'Ending ARR',    value: '$17.5M', delta: '16.9%', dir: 'up',   note: 'vs Last Year from $12.1M', icon: 'fa-regular fa-chart-line',    hue: 'teal' },
  { label: 'Gross Margin',  value: '68.4%',  delta: '2.1%',  dir: 'up',   note: 'vs Plan of 66.3%',         icon: 'fa-regular fa-percent',       hue: 'cyan' },
  { label: 'Opex Variance', value: '$1.2M',  delta: '4.3%',  dir: 'down', note: 'Favourable to budget',     icon: 'fa-regular fa-money-bill-trend-up', hue: 'indigo' },
];

const ROWS = [
  { id: 1, entity: 'EMEA Entity',  source: 'Sage Intacct', status: 'success', updated: 'Feb 13, 8:32 am' },
  { id: 2, entity: 'APAC Holdings', source: 'NetSuite',    status: 'success', updated: 'Feb 13, 8:14 am' },
  { id: 3, entity: 'US Consolidated', source: 'Snowflake', status: 'success', updated: 'Feb 13, 7:58 am' },
];

class Component extends DCLogic {
  componentDidMount() {
    if (!window.FolioDS) {
      this._dsWait = setInterval(() => {
        if (window.FolioDS) { clearInterval(this._dsWait); this.forceUpdate(); }
      }, 60);
    }
  }

  componentWillUnmount() {
    if (this._dsWait) clearInterval(this._dsWait);
  }

  // --- Nested stat tile. Container is glass (§1); the type hierarchy inside
  //     is Card.md's stat card verbatim — title-3 Medium label, display-2 Bold
  //     value, caption-1 delta, caption-2 note.
  renderStat(F, stat) {
    const { Text, IconBadge } = F;
    return React.createElement('div', {
      key: stat.label,
      className: 'glass-nested',
      style: { flex: 1, padding: 16, display: 'flex', flexDirection: 'column', gap: 8 },
    },
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 } },
        React.createElement(Text, { variant: 'title-3', weight: 'medium', color: '#4A5567' }, stat.label),
        React.createElement(IconBadge, { icon: stat.icon, hue: stat.hue, size: 'sm' }),
      ),
      React.createElement('div', { style: { display: 'flex', alignItems: 'baseline', gap: 8 } },
        React.createElement(Text, { variant: 'display-2', weight: 'bold', color: '#222B3A' }, stat.value),
        React.createElement(Text, {
          variant: 'caption-1',
          weight: 'medium',
          color: stat.dir === 'up' ? '#067647' : '#912018',
        },
          React.createElement('i', {
            className: stat.dir === 'up' ? 'fa-regular fa-arrow-trend-up' : 'fa-regular fa-arrow-trend-down',
            style: { marginRight: 4 },
          }),
          stat.delta,
        ),
      ),
      React.createElement(Text, { variant: 'caption-2', color: '#677489' }, stat.note),
    );
  }

  // --- Back panel: frosted matte, translateZ 0. Densest content, so it gets
  //     the only variant that keeps small text legible over the blobs.
  renderBackPanel(F) {
    const { PageHeader, Badge, Text, Table, StatusDot, Cell } = F;

    const columns = [
      { key: 'entity', label: 'Entity' },
      { key: 'source', label: 'Source' },
      {
        key: 'status', label: 'Status', sortable: false,
        render: () => React.createElement('span', { style: { display: 'inline-flex', alignItems: 'center' } },
          React.createElement(StatusDot, { color: 'success' })),
      },
      { key: 'updated', label: 'Last Updated' },
      {
        key: 'details', label: '', align: 'right', sortable: false,
        render: () => React.createElement(Cell.Link, { onClick: () => {} }, 'View'),
      },
    ];

    return React.createElement('div', {
      className: 'panel glass-frosted',
      style: { '--depth': '0px', width: 860, left: 0, top: 40, padding: 24 },
    },
      React.createElement('div', { style: { position: 'relative', display: 'flex', flexDirection: 'column', gap: 20 } },
        React.createElement(PageHeader, {
          icon: React.createElement('i', { className: 'fa-regular fa-gauge-high' }),
          title: 'Executive Overview',
          badges: React.createElement(Badge, { color: 'success', type: 'solid', size: 'md' }, 'Live'),
        }),
        React.createElement('div', { style: { display: 'flex', gap: 16 } },
          STATS.map((s) => this.renderStat(F, s)),
        ),
        React.createElement('div', { className: 'glass-nested', style: { padding: 16, display: 'flex', flexDirection: 'column', gap: 12 } },
          React.createElement(Text, { variant: 'title-3', weight: 'medium', color: '#222B3A' }, 'Consolidation status'),
          React.createElement(Table, { columns, rows: ROWS }),
        ),
      ),
    );
  }

  // --- Middle panel: clear mirror, translateZ 70px. Low blur, so its content
  //     stays sparse — a title, a legend, and the chart.
  renderChartPanel(F) {
    const { Text } = F;

    const legendEl = React.createElement('div', { style: { display: 'flex', gap: 16 } },
      SERIES.map((s) => React.createElement('span', {
        key: s.label,
        style: { display: 'inline-flex', alignItems: 'center', gap: 6 },
      },
        // A dashed series gets a dashed line-key, not a dot — otherwise
        // Actuals and Forecast show as two identical teal dots.
        React.createElement('span', {
          style: s.dashed
            ? { width: 14, height: 0, borderTop: '2px dashed ' + s.color }
            : { width: 8, height: 8, borderRadius: 9999, background: s.color },
        }),
        React.createElement(Text, { variant: 'caption-1', color: '#4A5567' }, s.label),
      )),
    );

    // 2px round-capped strokes, no area fills. No per-point value labels:
    // this is a decorative hero graphic, which BRAND-FOUNDATION.md's
    // "Chart data-point display" rule explicitly exempts.
    const chartEl = React.createElement('svg', {
      viewBox: '0 0 420 140', width: '100%', height: 160, role: 'img',
      'aria-label': 'Revenue trend — actuals, forecast, and budget',
    },
      [0, 35, 70, 105, 140].map((y) => React.createElement('line', {
        key: 'g' + y, x1: 0, y1: y, x2: 420, y2: y,
        stroke: 'rgba(34,43,58,0.10)', strokeWidth: 1,
      })),
      SERIES.map((s) => React.createElement('polyline', {
        key: s.label, points: s.points, fill: 'none',
        stroke: s.color, strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round',
        strokeDasharray: s.dashed ? '4 4' : undefined,
      })),
    );

    const axisEl = React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between' } },
      ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'].map((m) =>
        React.createElement(Text, { key: m, variant: 'caption-2', color: '#677489' }, m)),
    );

    return React.createElement('div', {
      className: 'panel glass-mirror',
      style: { '--depth': '70px', width: 520, left: 620, top: 300, padding: 24 },
    },
      React.createElement('div', { className: 'streak' }),
      React.createElement('div', { style: { position: 'relative', display: 'flex', flexDirection: 'column', gap: 16 } },
        React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
          React.createElement(Text, { variant: 'title-3', weight: 'medium', color: '#222B3A' }, 'FY26 Revenue Trend'),
          legendEl,
        ),
        chartEl,
        axisEl,
      ),
    );
  }

  // --- Front panel: clear mirror + AI glow, translateZ 160px. Small and
  //     simple, so it needs the internal diagonal skew cue to read as tilted.
  //     Purple appears here and nowhere else in the composition.
  renderAiPanel(F) {
    const { Text, Badge } = F;

    return React.createElement('div', { className: 'float', style: { position: 'absolute', left: 340, top: 560 } },
      React.createElement('div', {
        className: 'panel glass-mirror glow-ai',
        style: { '--depth': '160px', width: 460, left: 0, top: 0, padding: 24 },
      },
        React.createElement('div', { className: 'streak' }),
        React.createElement('div', { className: 'skew-lines' }),
        React.createElement('div', { style: { position: 'relative', display: 'flex', flexDirection: 'column', gap: 12 } },
          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 12 } },
            // AI icon: plain fa-regular glyph over the AI gradient. IconBadge is
            // not used here — its hue axis has no purple, by design.
            React.createElement('span', {
              style: {
                width: 40, height: 40, borderRadius: 9999,
                background: 'linear-gradient(135deg, #7A5AF8 10%, #9B8AFB 50%, #6938EF 100%)',
                display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
              },
            }, React.createElement('i', { className: 'fa-regular fa-sparkles', style: { fontSize: 16, color: '#fff' } })),
            React.createElement(Badge, { color: 'ai', type: 'solid', size: 'md' }, 'Cube AI Analyst'),
          ),
          React.createElement(Text, {
            variant: 'title-2', weight: 'semibold', className: 'ai-gradient-text',
          }, 'Churn assumption is understated'),
          React.createElement(Text, { variant: 'body', color: '#353F4F' },
            'Your $150K/mo churn assumption sits 17% below the trailing six-month average of $180K. Stress-testing at actuals moves FY26 ending ARR to $16.8M.'),
        ),
      ),
    );
  }

  renderVals() {
    const F = window.FolioDS;
    if (!F) return {};

    const stageEl = React.createElement(React.Fragment, null,
      this.renderBackPanel(F),
      this.renderChartPanel(F),
      this.renderAiPanel(F),
    );

    return { stageEl };
  }
}
</script>
</body>
