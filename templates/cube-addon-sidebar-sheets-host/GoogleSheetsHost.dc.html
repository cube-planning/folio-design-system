<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Cube Add-on — Google Sheets Host" description="Sheets mockup with the Folio-styled Cube sidebar docked on the right." -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width:100vw;height:100vh;display:flex;flex-direction:column;background:#fff;font-family:Arial,sans-serif;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px 0">
<div style="width:36px;height:36px;background:#0F9D58;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fa-solid fa-table-cells" style="color:#fff;font-size:16px"></i></div>
<div style="display:flex;flex-direction:column">
<div style="display:flex;align-items:center;gap:8px">
<span style="font-size:18px;color:#202124">Untitled spreadsheet</span>
<i class="fa-regular fa-star" style="color:#5f6368;font-size:14px"></i>
<i class="fa-solid fa-folder" style="color:#5f6368;font-size:13px"></i>
<i class="fa-solid fa-cloud" style="color:#5f6368;font-size:13px"></i>
</div>
<div style="display:flex;gap:16px;margin-top:2px">
<span style="font-size:13px;color:#3c4043">File</span><span style="font-size:13px;color:#3c4043">Edit</span><span style="font-size:13px;color:#3c4043">View</span><span style="font-size:13px;color:#3c4043">Insert</span><span style="font-size:13px;color:#3c4043">Format</span><span style="font-size:13px;color:#3c4043">Data</span><span style="font-size:13px;color:#3c4043">Tools</span><span style="font-size:13px;color:#3c4043">Gemini</span>
<div style="position:relative">
<span onClick="{{ toggleExtMenu }}" style="font-size:13px;color:#202124;font-weight:500;cursor:pointer;padding:2px 4px;background:{{ extMenuOpen ? '#E8EAED' : 'transparent' }};border-radius:4px">Extensions</span>
<sc-if value="{{ extMenuOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:24px;left:0;background:#fff;border:1px solid #E1E3E1;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.2);width:230px;padding:6px 0;z-index:10;font-family:Arial,sans-serif">
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;color:#3c4043;font-size:13px"><i class="fa-solid fa-puzzle-piece" style="width:14px;color:#5f6368"></i>Add-ons</div>
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;color:#3c4043;font-size:13px"><i class="fa-solid fa-circle-play" style="width:14px;color:#5f6368"></i>Macros</div>
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;color:#3c4043;font-size:13px"><i class="fa-solid fa-code" style="width:14px;color:#5f6368"></i>Apps Script</div>
<div style="height:1px;background:#E1E3E1;margin:4px 0"></div>
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;color:#3c4043;font-size:13px"><i class="fa-solid fa-caret-right" style="width:14px;color:#5f6368"></i>AppSheet</div>
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;color:#3c4043;font-size:13px"><i class="fa-solid fa-share-nodes" style="width:14px;color:#5f6368"></i>Data Studio</div>
<div style="height:1px;background:#E1E3E1;margin:4px 0"></div>
<div style="position:relative">
<div onClick="{{ toggleCubeSubmenu }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;color:#3c4043;font-size:13px;cursor:pointer;background:{{ cubeSubmenuOpen ? '#F1F3F4' : 'transparent' }}"><div style="display:flex;align-items:center;gap:10px"><i class="fa-solid fa-table-cells" style="width:14px;color:#5f6368"></i>Cube Planning</div><i class="fa-solid fa-chevron-right" style="font-size:10px;color:#5f6368"></i></div>
<sc-if value="{{ cubeSubmenuOpen }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;top:0;left:228px;background:#fff;border:1px solid #E1E3E1;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,0.2);width:170px;padding:6px 0;z-index:11">
<div onClick="{{ openSidebarFromMenu }}" style="padding:8px 16px;color:#3c4043;font-size:13px;cursor:pointer">Open Sidebar</div>
<div style="height:1px;background:#E1E3E1;margin:4px 0"></div>
<div style="padding:8px 16px;color:#3c4043;font-size:13px;cursor:pointer">Help</div>
</div>
</sc-if>
</div>
<div style="display:flex;align-items:center;gap:10px;padding:8px 16px;color:#3c4043;font-size:13px"><i class="fa-solid fa-caret-right" style="width:14px;color:#5f6368"></i>Jira Cloud for Sheets</div>
</div>
</sc-if>
</div>
<span style="font-size:13px;color:#3c4043">Help</span>
</div>
</div>
<div style="flex:1"></div>
<i class="fa-solid fa-clock-rotate-left" style="color:#5f6368;font-size:16px"></i>
<i class="fa-solid fa-comment" style="color:#5f6368;font-size:16px"></i>
<i class="fa-solid fa-video" style="color:#5f6368;font-size:16px"></i>
<div style="display:flex;align-items:center;gap:6px;background:#C2E7FF;color:#001D35;border-radius:20px;padding:6px 16px;font-size:14px;cursor:pointer"><i class="fa-solid fa-lock" style="font-size:12px"></i>Share</div>
<div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4285F4,#9B72CB,#D96570);display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-sparkles" style="color:#fff;font-size:13px"></i></div>
<div style="width:28px;height:28px;border-radius:50%;background:#F9AB00;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600">A</div>
</div>
<div style="display:flex;align-items:center;gap:10px;padding:6px 16px;border-bottom:1px solid #E1E3E1;flex-wrap:nowrap;overflow:hidden">
<div style="display:flex;align-items:center;gap:4px;border:1px solid #dadce0;border-radius:20px;padding:4px 10px;color:#5f6368;font-size:12px"><i class="fa-solid fa-magnifying-glass" style="font-size:11px"></i>Menus</div>
<i class="fa-solid fa-arrow-rotate-left" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-arrow-rotate-right" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-print" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-paintbrush" style="color:#5f6368;font-size:13px"></i>
<span style="color:#5f6368;font-size:13px">100%</span><i class="fa-solid fa-chevron-down" style="color:#5f6368;font-size:9px"></i>
<div style="width:1px;height:16px;background:#E1E3E1"></div>
<i class="fa-solid fa-dollar-sign" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-percent" style="color:#5f6368;font-size:13px"></i><span style="color:#5f6368;font-size:12px">.0</span><span style="color:#5f6368;font-size:12px">.00</span><span style="color:#5f6368;font-size:12px">123</span>
<div style="width:1px;height:16px;background:#E1E3E1"></div>
<span style="color:#3c4043;font-size:13px">Default</span><i class="fa-solid fa-chevron-down" style="color:#5f6368;font-size:9px"></i>
<div style="width:1px;height:16px;background:#E1E3E1"></div>
<i class="fa-solid fa-minus" style="color:#5f6368;font-size:11px"></i><span style="color:#3c4043;font-size:12px;border:1px solid #dadce0;border-radius:4px;padding:1px 6px">10</span><i class="fa-solid fa-plus" style="color:#5f6368;font-size:11px"></i>
<div style="width:1px;height:16px;background:#E1E3E1"></div>
<b style="color:#3c4043;font-size:13px">B</b><i style="color:#3c4043;font-size:13px">I</i><span style="color:#3c4043;font-size:13px;text-decoration:line-through">S</span>
<span style="color:#3c4043;font-size:13px;border-bottom:3px solid #202124">A</span>
<i class="fa-solid fa-fill-drip" style="color:#5f6368;font-size:13px"></i>
<i class="fa-solid fa-border-all" style="color:#5f6368;font-size:13px"></i>
<i class="fa-solid fa-table-cells" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-chevron-down" style="color:#5f6368;font-size:9px"></i>
<i class="fa-solid fa-align-left" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-chevron-down" style="color:#5f6368;font-size:9px"></i>
<i class="fa-solid fa-arrows-up-down" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-chevron-down" style="color:#5f6368;font-size:9px"></i>
<i class="fa-solid fa-text-width" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-chevron-down" style="color:#5f6368;font-size:9px"></i>
<div style="width:1px;height:16px;background:#E1E3E1"></div>
<i class="fa-solid fa-link" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-comment" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-chart-simple" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-filter" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-table" style="color:#5f6368;font-size:13px"></i><i class="fa-solid fa-chevron-down" style="color:#5f6368;font-size:9px"></i>
<i class="fa-solid fa-sigma" style="color:#5f6368;font-size:13px"></i>
</div>
<div style="height:28px;border-bottom:1px solid #E1E3E1;display:flex;align-items:center;padding:0 10px;gap:10px">
<div style="display:flex;align-items:center;gap:4px;width:70px"><span style="font-size:12px;color:#202124">{{ cellRef }}</span><i class="fa-solid fa-chevron-down" style="color:#5f6368;font-size:8px"></i></div>
<i style="color:#5f6368;font-size:12px;font-style:italic">fx</i>
<div style="flex:1"></div>
</div>
<div style="flex:1;position:relative;overflow:hidden">
<div style="position:absolute;inset:0;overflow:auto">
<div style="display:grid;grid-template-columns:32px repeat(15,100px);font-size:12px;color:#202124">
<sc-for list="{{ flatCells }}" as="cell" hint-placeholder-count="100">
<div onClick="{{ cell.onClick }}" data-col="{{ cell.col }}" data-row="{{ cell.row }}" style="{{ cell.style }}">{{ cell.label }}</div>
</sc-for>
</div>
</div>
<sc-if value="{{ sidebarOpen }}" hint-placeholder-val="{{ true }}">
<div style="position:fixed;top:16px;right:16px;bottom:16px;width:320px;box-shadow:0 8px 24px rgba(34,43,58,0.18);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;background:#F1F3F4">
<div style="height:34px;display:flex;align-items:center;padding:0 12px;justify-content:space-between;flex-shrink:0">
<span style="font-size:13px;color:#3c4043;font-family:Arial,sans-serif">Cube</span>
<i class="fa-solid fa-xmark" onClick="{{ closeSidebar }}" style="color:#5f6368;font-size:14px;cursor:pointer"></i>
</div>
<div style="flex:1;overflow:auto;padding:16px"><dc-import name="CubeAddonSidebar" cell-ref="{{ cellRef }}" style="width:100%;height:100%" hint-size="320px,100%"></dc-import></div>
</div>
</sc-if>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { extMenuOpen: false, cubeSubmenuOpen: false, sidebarOpen: true, selCol: 0, selRow: 1 };
  selectCell = (e) => { const col = parseInt(e.currentTarget.getAttribute('data-col'), 10); const row = parseInt(e.currentTarget.getAttribute('data-row'), 10); this.setState({ selCol: col, selRow: row }); };
  selectColumnHeader = (e) => { const col = parseInt(e.currentTarget.getAttribute('data-col'), 10); this.setState({ selCol: col }); };
  selectRowHeader = (e) => { const row = parseInt(e.currentTarget.getAttribute('data-row'), 10); this.setState({ selRow: row }); };
  toggleExtMenu = () => this.setState(s => ({ extMenuOpen: !s.extMenuOpen, cubeSubmenuOpen: false }));
  toggleCubeSubmenu = () => this.setState(s => ({ cubeSubmenuOpen: !s.cubeSubmenuOpen }));
  openSidebarFromMenu = () => this.setState({ sidebarOpen: true, extMenuOpen: false, cubeSubmenuOpen: false });
  closeSidebar = () => this.setState({ sidebarOpen: false });
  colLetters = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
  colLetter = (idx) => this.colLetters[idx];
  buildFlatCells = (selCol, selRow) => {
    const cells = [];
    cells.push({ onClick: () => {}, col: '', row: '', label: '', style: 'width:32px;height:20px;border:1px solid #E1E3E1;background:#F8F9FA' });
    this.colLetters.forEach((letter, idx) => {
      const sel = idx === selCol;
      cells.push({ onClick: this.selectColumnHeader, col: idx, row: '', label: letter, style: 'height:20px;border:1px solid #E1E3E1;background:' + (sel ? '#1155CC' : '#F8F9FA') + ';color:' + (sel ? '#fff' : '#5f6368') + ';font-weight:' + (sel ? 700 : 400) + ';text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center' });
    });
    for (let r = 1; r <= 40; r++) {
      const rowSel = r === selRow;
      cells.push({ onClick: this.selectRowHeader, col: '', row: r, label: r, style: 'height:20px;border:1px solid #E1E3E1;background:' + (rowSel ? '#1155CC' : '#F8F9FA') + ';color:' + (rowSel ? '#fff' : '#5f6368') + ';font-weight:' + (rowSel ? 700 : 400) + ';text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center' });
      this.colLetters.forEach((letter, idx) => {
        const isSel = idx === selCol && rowSel;
        cells.push({ onClick: this.selectCell, col: idx, row: r, label: '', style: 'height:20px;cursor:pointer;background:' + (isSel ? '#E8F0FE' : '#fff') + ';border:' + (isSel ? '2px solid #1A73E8' : '1px solid #E1E3E1') });
      });
    }
    return cells;
  };
  renderVals() {
    const s = this.state;
    return {
      extMenuOpen: s.extMenuOpen, cubeSubmenuOpen: s.cubeSubmenuOpen, sidebarOpen: s.sidebarOpen,
      toggleExtMenu: this.toggleExtMenu, toggleCubeSubmenu: this.toggleCubeSubmenu, openSidebarFromMenu: this.openSidebarFromMenu,
      closeSidebar: this.closeSidebar,
      cellRef: this.colLetter(s.selCol) + s.selRow,
      flatCells: this.buildFlatCells(s.selCol, s.selRow)
    };
  }
}
</script>
</body>
</html>
