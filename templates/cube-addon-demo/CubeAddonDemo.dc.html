<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Cube Add-on Demo" description="The Cube Sheets/Excel Add-on sidebar — all four Build, Analyze, Publish and Tables sections — built entirely from real Folio components (AddonSidebar, AddonTopNav, AccordionSection, BuildPanel, AnalyzePanel, PublishCard, TablesCard, RangeSelector, FilterField, ExpandCollapseControl)." -->
<helmet>
  <script src="./ds-base.js"></script>
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'DM Sans',sans-serif; background:#F0EEE6; padding:40px; min-height:100vh; }
    .section-label { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#98A2B3; margin:32px 0 10px; }
    .section-label:first-of-type { margin-top:0; }
    .row { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap; }
    .switcher-row { margin-top:16px; }
  </style>
</helmet>

<p class="section-label">Sidebar shell — demo state switcher (Build panel view)</p>
<div class="switcher-row">{{ buildViewSwitcherEl }}</div>

<p class="section-label">Cube Add-on sidebar</p>
<div class="row">{{ sidebarEl }}</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;420px&quot;,&quot;height&quot;:&quot;900px&quot;}}">
const BUILD_VIEW_OPTIONS = [
  { value: 'range', label: 'Range' },
  { value: 'rangeTree', label: 'Range · picker open' },
  { value: 'drilldown', label: 'Drilldown' },
];

const INITIAL_NODES = [
  { id: 'all', label: 'All', level: 0, checked: 'checked' },
  { id: 'sheet1', label: 'Sheet 1', level: 1, checked: 'checked' },
  { id: 'range1', label: 'Range 1: (A1:E14)', level: 2, checked: 'checked' },
  { id: 'sheet2', label: 'Sheet 2', level: 1, checked: 'checked' },
  { id: 'drilldown1', label: 'Drilldown 1', level: 2, checked: 'checked' },
];

const RANGE_FILTERS = [
  { label: 'Time', value: 'Oct-25' },
  { label: 'Department', value: 'All Departments' },
  { label: 'Scenario', value: 'Actuals' },
  { label: 'Entity', value: 'Global Co' },
  { label: 'Product', value: 'All Products' },
  { label: 'Market', value: 'All Markets' },
];

const DRILLDOWN_FILTERS = [
  { label: 'Account', value: '20000 – Accounts Payable' },
  ...RANGE_FILTERS,
];

const TABLES = [
  { id: 1, name: 'AP Aging', meta: 'Updated Aug 24' },
  { id: 2, name: 'Headcount Plan', meta: 'Updated Aug 20' },
];

class Component extends DCLogic {
  // Sections open independently — opening Analyze does not close Build.
  // Matches the accordion rule documented in CubeAddonSidebar.jsx.
  state = {
    openSections: { build: true, analyze: false, publish: false, tables: false },
    buildView: 'range',
    dimView: 'dimensions',
    excludeZeroRow: true,
    expandMode: 'expand',
    nodes: INITIAL_NODES,
    publishTab: 'data',
    webReportState: 'empty',
    reportName: '',
    reportArea: null,
    description: '',
    sharing: 'private',
    allowDataInput: false,
    report: null,
    tablesTab: 'existing',
    tableName: '',
    dataSourceLabel: null,
    newScenario: 'Actuals',
    newPermission: 'View only',
    tables: TABLES,
    selectedTableId: null,
  };

  componentDidMount() {
    if (!window.FolioDS) {
      this._dsWait = setInterval(() => {
        if (window.FolioDS) { clearInterval(this._dsWait); this.forceUpdate(); }
      }, 60);
    }
  }

  componentWillUnmount() {
    if (this._dsWait) clearInterval(this._dsWait);
  }

  toggleSection(id) {
    this.setState((s) => ({ openSections: { ...s.openSections, [id]: !s.openSections[id] } }));
  }

  toggleNode(id) {
    this.setState((s) => ({
      nodes: s.nodes.map((n) => n.id === id
        ? { ...n, checked: n.checked === 'checked' ? 'unchecked' : 'checked' }
        : n),
    }));
  }

  renderVals() {
    const F = window.FolioDS;
    if (!F) return {};
    const {
      AddonSidebar, AddonTopNav, AccordionSection, BuildPanel, AnalyzePanel,
      PublishCard, TablesCard, SegmentedButton,
    } = F;

    const isDrilldown = this.state.buildView === 'drilldown';
    const isTreeOpen = this.state.buildView === 'rangeTree';

    const buildViewSwitcherEl = React.createElement(SegmentedButton, {
      options: BUILD_VIEW_OPTIONS,
      value: this.state.buildView,
      onChange: (v) => this.setState({ buildView: v }),
      size: 'small',
    });

    const buildPanelEl = React.createElement(BuildPanel, {
      rangeLabel: isDrilldown ? 'Accounts Payable' : 'Range 1 (A1:E14)',
      rangeMeta: isDrilldown ? 'Drilldown' : undefined,
      rangeTreeOpen: isTreeOpen,
      rangeTreeNodes: this.state.nodes,
      onRangeTriggerClick: () => this.setState({ buildView: isTreeOpen ? 'range' : 'rangeTree' }),
      onRangeToggleNode: (id) => this.toggleNode(id),
      onRangeApply: () => this.setState({ buildView: 'range' }),
      showBack: isDrilldown,
      onBack: () => this.setState({ buildView: 'range' }),
      viewMode: this.state.dimView,
      onViewModeChange: (v) => this.setState({ dimView: v }),
      filters: isDrilldown ? DRILLDOWN_FILTERS : RANGE_FILTERS,
      onFetchData: () => {},
      onSources: () => {},
      lastPublish: isDrilldown ? 'Aug 27, 14:02 by Nan Osborne' : undefined,
      onOpenLastPublish: () => {},
      showPivotAction: isDrilldown,
      onCreatePivotTable: () => {},
    });

    const analyzePanelEl = React.createElement(AnalyzePanel, {
      onAnalyzeForYou: () => {},
      onDrilldown: () => {},
      excludeZeroRow: this.state.excludeZeroRow,
      onExcludeZeroRowChange: (v) => this.setState({ excludeZeroRow: v }),
      expandMode: this.state.expandMode,
      onExpand: () => this.setState({ expandMode: 'expand' }),
      onExpandAll: () => this.setState({ expandMode: 'expandAll' }),
      onCollapse: () => this.setState({ expandMode: null }),
      collapseDisabled: !this.state.expandMode,
      onValidate: () => {},
    });

    const publishCardEl = React.createElement(PublishCard, {
      tab: this.state.publishTab,
      onTabChange: (v) => this.setState({ publishTab: v }),
      blockingDimensions: isDrilldown ? [] : ['Entity'],
      onPublishData: () => {},
      webReportState: this.state.webReportState,
      onCreateReport: () => this.setState({ webReportState: 'create' }),
      onOverwrite: () => this.setState({ webReportState: 'existing' }),
      reportName: this.state.reportName,
      onReportNameChange: (v) => this.setState({ reportName: v }),
      reportArea: this.state.reportArea,
      reportAreaKind: this.state.reportArea ? 'range' : null,
      onPickReportArea: () => this.setState({ reportArea: 'Range 1 (A1:E14)' }),
      description: this.state.description,
      onDescriptionChange: (v) => this.setState({ description: v }),
      sharing: this.state.sharing,
      onSharingChange: (v) => this.setState({ sharing: v }),
      allowDataInput: this.state.allowDataInput,
      onAllowDataInputChange: (v) => this.setState({ allowDataInput: v }),
      onCreateWebReport: () => this.setState({
        report: { name: this.state.reportName || 'Untitled Report', meta: this.state.reportArea || undefined },
        webReportState: 'existing',
      }),
      onCancelCreate: () => this.setState({ webReportState: 'empty' }),
      report: this.state.report,
      onReportAction: (action) => { if (action === 'edit') this.setState({ webReportState: 'create' }); },
    });

    const tablesCardEl = React.createElement(TablesCard, {
      tab: this.state.tablesTab,
      onTabChange: (v) => this.setState({ tablesTab: v }),
      tableName: this.state.tableName,
      onTableNameChange: (v) => this.setState({ tableName: v }),
      dataSourceLabel: this.state.dataSourceLabel,
      onPickDataSource: () => this.setState({ dataSourceLabel: 'Company' }),
      newTableScenario: this.state.newScenario,
      onNewTableScenarioChange: (v) => this.setState({ newScenario: v }),
      newTablePermission: this.state.newPermission,
      onNewTablePermissionChange: (v) => this.setState({ newPermission: v }),
      onCreateTable: () => this.setState((s) => {
        const id = s.tables.length + 1;
        return {
          tables: [...s.tables, { id, name: s.tableName || ('Table ' + id), meta: 'Just created' }],
          tableName: '',
          tablesTab: 'existing',
        };
      }),
      tables: this.state.tables,
      selectedId: this.state.selectedTableId,
      onSelectTable: (id) => this.setState({ selectedTableId: id }),
      onOpenTable: () => {},
    });

    const sidebarEl = React.createElement(AddonSidebar, {
      topNav: React.createElement(AddonTopNav, { dataSource: 'Company', currency: 'USD', hasWarning: true }),
      children: [
        React.createElement(AccordionSection, {
          key: 'build',
          icon: React.createElement('i', { className: 'fa-solid fa-table-cells-large' }),
          title: 'Build',
          open: this.state.openSections.build,
          onToggle: () => this.toggleSection('build'),
        }, buildPanelEl),
        React.createElement(AccordionSection, {
          key: 'analyze',
          icon: React.createElement('i', { className: 'fa-solid fa-magnifying-glass' }),
          title: 'Analyze',
          theme: 'purple',
          open: this.state.openSections.analyze,
          onToggle: () => this.toggleSection('analyze'),
        }, analyzePanelEl),
        React.createElement(AccordionSection, {
          key: 'publish',
          icon: React.createElement('i', { className: 'fa-solid fa-arrow-up-from-bracket' }),
          title: 'Publish',
          open: this.state.openSections.publish,
          onToggle: () => this.toggleSection('publish'),
        }, publishCardEl),
        React.createElement(AccordionSection, {
          key: 'tables',
          icon: React.createElement('i', { className: 'fa-solid fa-table-cells' }),
          title: 'Tables',
          open: this.state.openSections.tables,
          onToggle: () => this.toggleSection('tables'),
        }, tablesCardEl),
      ],
    });

    return { buildViewSwitcherEl, sidebarEl };
  }
}
</script>
</body>
</html>
